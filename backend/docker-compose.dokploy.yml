# Déploiement Dokploy (type "Compose") du backend kaapi.
#
# Différences avec docker-compose.yml (dev) :
#   - AUCUN port publié sur l'hôte → zéro conflit ; Traefik route l'API par domaine.
#   - Pas de bind-mount `.:/app` ni de --reload → le code est figé dans l'image.
#   - Secrets pilotés par variables d'env (onglet Environment de Dokploy).
#   - `api` est sur kaapi-network (services internes) ET dokploy-network (Traefik).
#   - Services de données (db/redis/vault/minio) restent internes à kaapi-network.
#
# Dokploy → onglet "Domains" :
#   - Service : api · Container port : 8000 · Host : veille-api.kortexai.dev
#   - HTTPS (Let's Encrypt) · Path / · Health check path : /
#
# ⚠️ Un backend kaapi tourne déjà sur ce VPS (projet "petroapi"). Déploie ceci
#    dans un projet/domaine distinct, ou remplace l'ancien selon ton intention.

services:
  api:
    # Seul service qui construit l'image ; les autres la réutilisent.
    build:
      context: .
      dockerfile: Dockerfile
    image: kaapi-app:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@kaapi-db:5432/kaapi
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONUNBUFFERED=1
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-token}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - QDRANT_URL=${QDRANT_URL:-https://qdrant-client.kortexai.dev}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HF_HOME=/app/.hf_cache
    # Prod : pas de --reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - hf_cache:/app/.hf_cache
    depends_on:
      kaapi-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - kaapi-network
      - dokploy-network

  celery:
    image: kaapi-app:latest
    restart: unless-stopped
    command: python -m celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@kaapi-db:5432/kaapi
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-token}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - QDRANT_URL=${QDRANT_URL:-https://qdrant-client.kortexai.dev}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HF_HOME=/app/.hf_cache
    volumes:
      - hf_cache:/app/.hf_cache
    depends_on:
      - api
    networks:
      - kaapi-network

  metrics:
    image: kaapi-app:latest
    restart: unless-stopped
    command: python app/metrics_server.py
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8001"
    depends_on:
      - api
    networks:
      - kaapi-network

  kaapi-db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=kaapi
    networks:
      - kaapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  kaapi-db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=kaapi-db
      - POSTGRES_DB=kaapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_EXTRA_OPTS=--schema=public --blobs
      - SCHEDULE=0 0 * * *
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_CMD=pg_isready -U postgres -h kaapi-db
      - HEALTHCHECK_TIMEOUT=10s
      - HEALTHCHECK_INTERVAL=10s
    volumes:
      - postgres_backups:/backups
    depends_on:
      kaapi-db:
        condition: service_healthy
    networks:
      - kaapi-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - kaapi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    restart: unless-stopped
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-dev-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - kaapi-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kaapi-network

volumes:
  postgres_data:
  postgres_backups:
  minio_data:
  hf_cache:

networks:
  kaapi-network:
    driver: bridge
  # Réseau overlay de Dokploy/Traefik (créé par Dokploy) — pour exposer `api`.
  dokploy-network:
    external: true
