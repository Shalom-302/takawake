# This file extends your main docker-compose with the monitoring services
services:
  # Your API needs to be accessible from the monitoring services
  api:
    networks:
      - kaapi-network
      - monitoring-network

  # Service de métriques dédié - contourne les problèmes de middleware de sécurité
  metrics:
    build: .
    container_name: kaapi-metrics
    command: python app/metrics_server.py
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - kaapi-network
      - monitoring-network

  # Monitoring services
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./app/plugins/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - monitoring-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./app/plugins/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./app/plugins/monitoring/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:latest
    ports:
      - "3000:3000"
    volumes:
      - ./app/plugins/monitoring/grafana-provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./app/plugins/monitoring/grafana-provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./app/plugins/monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - monitoring-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - monitoring-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/plugins/monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - kaapi-network

networks:
  kaapi-network:
    external: false
    name: kaapi-network
  monitoring-network:
    driver: bridge
