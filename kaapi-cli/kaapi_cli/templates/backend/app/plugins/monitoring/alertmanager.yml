# alertmanager.yml
route:
  group_by: [route, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack-notifications'
  routes:
  - match_re:
      severity: critical
    receiver: 'pagerduty'

inhibit_rules:
  - source_match:
      severity: critical
    target_match_re:
      severity: warning|info
    equal: [route]

receivers:
- name: 'slack-notifications'
  slack_configs:
  - api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'
    channel: '#alerts'
    send_resolved: true
    title: '{{ .CommonAnnotations.summary }}'