[tool.poetry]
name = "kaapi-cli"
version = "0.1.0"
description = "CLI tool for initializing and managing Kaapi projects"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
typer = "^0.7.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[tool.poetry.scripts]
kaapi = "kaapi_cli.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
