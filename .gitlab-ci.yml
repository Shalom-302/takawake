# ─────────────────────────────────────────────────────
# Shared app pipeline — referenced REMOTELY by each app project.
# ─────────────────────────────────────────────────────
# SELF-CONTAINED on purpose: no `include:`. When a config file is referenced
# from another project (ci_config_path), nested cross-project includes are
# fragile and can fail with "Invalid configuration format". Keeping everything
# in this one file makes it bullet-proof — and it's still ONE file referenced
# by every app, so it stays DRY across apps.
#
# ── How an app uses it (zero file in the app repo) ──
# In the APP project: Settings → CI/CD → General pipelines →
#   "CI/CD configuration file" =
#       ops/ci/app-pipeline.yml@opensource/kaaops      ← <path>@<group>/<project>
# Requires the app project's CI job token to read the kaaops project
# (kaaops → Settings → CI/CD → Job token permissions).
#
# ── Per-app config = CI/CD variables (set once in the APP project) ──
#   VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY (type File), VPS_PROJECT_PATH, DOMAIN
#   VPS_PROJECT_PATH = the kaaops checkout on the VPS (where ./kaaops lives)
#   (branch, optional)  PROD_BRANCH (default main), STAGING_BRANCH (default develop)
#   (staging, optional) STAGING_VPS_*, STAGING_DOMAIN
#
# ── Pre-reqs on the VPS ──
#   ./kaaops add <DOMAIN> --repo <app repo> --branch <PROD_BRANCH>
#   and the VPS can git-pull the app repo (deploy key authorized).
# ─────────────────────────────────────────────────────

default:
  # Retry on runner/infrastructure failures, not on script errors
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 20m
  interruptible: true

variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  POSTGRES_VERSION: "15-alpine"
  REDIS_VERSION: "7-alpine"
  POSTGRES_USER: "test"
  POSTGRES_PASSWORD: "test"
  POSTGRES_DB: "kaapi_test"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/yarn"
  DOCKER_BUILDKIT: "1"
  # Deploy branches — override per app via project CI/CD variables:
  #   PROD_BRANCH=release  /  STAGING_BRANCH=qa
  PROD_BRANCH: main
  STAGING_BRANCH: develop

stages:
  - lint
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == $STAGING_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG

# ═══════════════════════════ LINT ═══════════════════════════
backend:lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: backend-lint-${PYTHON_VERSION}
    paths: [.cache/pip]
    policy: pull-push
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/
  allow_failure: true
  rules:
    - changes: ["backend/**/*", "requirements/**/*"]
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH

frontend:lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  cache:
    key: frontend-deps-${NODE_VERSION}
    paths: [.cache/yarn, client/node_modules/]
    policy: pull-push
  before_script:
    - cd client
    - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_FOLDER
  script:
    - yarn lint
  allow_failure: true
  rules:
    - changes: ["client/**/*"]
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH

frontend:typecheck:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  cache:
    key: frontend-deps-${NODE_VERSION}
    paths: [.cache/yarn, client/node_modules/]
    policy: pull
  before_script:
    - cd client
    - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_FOLDER
  script:
    - npx tsc --noEmit
  allow_failure: true
  rules:
    - changes: ["client/**/*"]
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH

# ═══════════════════════════ TEST ═══════════════════════════
backend:test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
      variables:
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: $POSTGRES_DB
    - name: redis:${REDIS_VERSION}
      alias: redis
  cache:
    key: backend-deps-${PYTHON_VERSION}
    paths: [.cache/pip]
    policy: pull-push
  variables:
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    ENVIRONMENT: "test"
    SECRET_KEY: "ci-test-secret-key-not-for-production"
  before_script:
    - cd backend
    - pip install --quiet --upgrade pip
    - pip install --quiet -r requirements.txt
    - pip install --quiet pytest pytest-asyncio pytest-cov httpx
  script:
    - pytest --cov=app --cov-report=xml --cov-report=term-missing -v || true
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - changes: ["backend/**/*", "requirements/**/*"]
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH

frontend:build:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: frontend-deps-${NODE_VERSION}
    paths: [.cache/yarn, client/node_modules/]
    policy: pull
  variables:
    NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
    NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api"
    NEXT_PUBLIC_ENABLE_PWA: "false"
  before_script:
    - cd client
    - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_FOLDER
  script:
    - yarn build
  rules:
    - changes: ["client/**/*"]
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH

# ═══════════════════════════ DEPLOY (SSH gateway) ═══════════════════════════
# Updates the app clone on the VPS, then lets kaaops build + roll it out.
.deploy_base:
  stage: deploy
  image: alpine:latest
  interruptible: false           # never cancel a deployment
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - chmod 600 "$VPS_SSH_PRIVATE_KEY"
    - ssh-add "$VPS_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  resource_group: deploy-$CI_ENVIRONMENT_NAME

deploy:production:
  extends: .deploy_base
  environment:
    name: production
    url: https://$DOMAIN
  script:
    - |
      ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
        "KAAOPS_PATH='${VPS_PROJECT_PATH}' APP_DOMAIN='${DOMAIN}' BRANCH='${PROD_BRANCH:-main}' bash -s" <<'DEPLOY_SCRIPT'
        set -euo pipefail
        cd "$KAAOPS_PATH"
        echo "── Updating app source: ops/apps/$APP_DOMAIN @ $BRANCH ──"
        git -C "ops/apps/$APP_DOMAIN" fetch origin
        git -C "ops/apps/$APP_DOMAIN" reset --hard "origin/$BRANCH"
        echo "── Deploying $APP_DOMAIN (build + rolling swap on the VPS) ──"
        ./kaaops deploy "$APP_DOMAIN" --build
        echo "── Deployment complete ──"
      DEPLOY_SCRIPT
    - |
      echo "Waiting 30s for services to stabilize..."
      sleep 30
      STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}/health" || echo "000")
      if [ "$STATUS" = "200" ]; then echo "Health check passed (HTTP $STATUS)"; else echo "Health check failed (HTTP $STATUS)"; exit 1; fi
  rules:
    - if: $CI_COMMIT_BRANCH == $PROD_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

deploy:staging:
  extends: .deploy_base
  environment:
    name: staging
    url: https://$STAGING_DOMAIN
  variables:
    VPS_HOST: $STAGING_VPS_HOST
    VPS_USER: $STAGING_VPS_USER
    VPS_SSH_PRIVATE_KEY: $STAGING_VPS_SSH_PRIVATE_KEY
    VPS_PROJECT_PATH: $STAGING_VPS_PROJECT_PATH
    DOMAIN: $STAGING_DOMAIN
  script:
    - |
      ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
        "KAAOPS_PATH='${VPS_PROJECT_PATH}' APP_DOMAIN='${DOMAIN}' BRANCH='${STAGING_BRANCH:-develop}' bash -s" <<'DEPLOY_SCRIPT'
        set -euo pipefail
        cd "$KAAOPS_PATH"
        echo "── Updating app source: ops/apps/$APP_DOMAIN @ $BRANCH ──"
        git -C "ops/apps/$APP_DOMAIN" fetch origin
        git -C "ops/apps/$APP_DOMAIN" reset --hard "origin/$BRANCH"
        echo "── Deploying $APP_DOMAIN (staging) ──"
        ./kaaops deploy "$APP_DOMAIN" --build
        echo "── Staging deployment complete ──"
      DEPLOY_SCRIPT
  rules:
    - if: $CI_COMMIT_BRANCH == $STAGING_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
